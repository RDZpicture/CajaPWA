<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecturas - Caja PWA</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121214">

  <style>
    :root {
      --bg: #121214;
      --card: #1e1e24;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #374151;
      --danger: #ef4444;
      --success: #10b981;
      --magna: #10b981;
      --premium: #ef4444;
      --diesel: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }

    /* Header Nav Bar */
    .header-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .nav-btn { 
      background: #27272a; border: 1px solid var(--border); color: var(--text); 
      padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; 
      cursor: pointer; display: flex; align-items: center; gap: 6px; text-decoration: none;
    }
    .nav-btn:active { background: #3f3f46; }

    .card { background: var(--card); border-radius: 12px; padding: 16px; border: 1px solid var(--border); }
    h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

    /* Precios Config */
    .prices-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 4px; }
    .price-box { display: flex; flex-direction: column; gap: 4px; }
    .price-box label { font-size: 0.75rem; font-weight: bold; }
    .price-box.magna label { color: var(--magna); }
    .price-box.premium label { color: var(--premium); }
    .price-box.diesel label { color: var(--diesel); }

    .input-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; color: var(--muted); }
    input { 
      background: #18181b; border: 1px solid var(--border); border-radius: 8px; 
      padding: 10px; color: #fff; font-size: 0.95rem; outline: none; transition: border 0.2s; width: 100%;
    }
    input:focus { border-color: var(--accent); }

    /* Secciones Retraíbles */
    .collapsible-header { 
      display: flex; justify-content: space-between; align-items: center; 
      cursor: pointer; user-select: none; padding: 4px 0;
    }
    .collapsible-header span.icon { transition: transform 0.2s; font-size: 0.8rem; }
    .collapsible-header.collapsed span.icon { transform: rotate(-90deg); }
    .collapsible-content { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
    .collapsible-content.hidden { display: none; }

    /* Contenedor de Dispensador Agrupado */
    .disp-group-card { background: #18181b; border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
    .disp-group-title { font-size: 0.9rem; font-weight: bold; color: #fff; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

    /* Filas de Entrada dentro del Dispensador */
    .fuel-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .fuel-row:last-child { margin-bottom: 0; }
    .inputs-pair { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; align-items: center; }
    .liters-result { font-size: 0.85rem; font-weight: bold; text-align: center; color: var(--text); background: #27272a; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }

    /* Etiquetas de Combustible */
    .tag-fuel { font-size: 0.75rem; font-weight: bold; padding: 2px 6px; border-radius: 4px; display: inline-block; width: fit-content; }
    .tag-magna { background: rgba(16, 185, 129, 0.2); color: var(--magna); }
    .tag-premium { background: rgba(239, 68, 68, 0.2); color: var(--premium); }
    .tag-diesel { background: rgba(245, 158, 11, 0.2); color: var(--diesel); }

    /* Tabla Resumen / Totales */
    .summary-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    .summary-table th, .summary-table td { 
      padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; 
    }
    .summary-table th { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }

    .diff-box { padding: 10px; border-radius: 8px; margin-top: 8px; font-weight: bold; text-align: center; font-size: 0.95rem; }
    .diff-ok { background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid var(--success); }
    .diff-bad { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); }

    .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 12px; }
  </style>
</head>
<body>

<div class="container">

  <!-- BARRA SUPERIOR NAV -->
  <div class="header-nav">
    <a href="index.html" class="nav-btn">➔ Volver a Caja</a>
    <span style="font-weight: bold; color: #fff;">Lecturas</span>
  </div>

  <!-- CONFIGURACIÓN DE PRECIOS -->
  <div class="card">
    <div class="collapsible-header" onclick="toggleSection('secPrecios', this)">
      <h2>Precios por Litro ($)</h2>
      <span class="icon">▼</span>
    </div>
    <div id="secPrecios" class="collapsible-content">
      <div class="prices-grid">
        <div class="price-box magna">
          <label>Magna</label>
          <input type="number" step="0.01" id="precioMagna" value="23.50" oninput="guardarPrecios(); calcularTotales();">
        </div>
        <div class="price-box premium">
          <label>Premium</label>
          <input type="number" step="0.01" id="precioPremium" value="25.00" oninput="guardarPrecios(); calcularTotales();">
        </div>
        <div class="price-box diesel">
          <label>Diesel</label>
          <input type="number" step="0.01" id="precioDiesel" value="24.80" oninput="guardarPrecios(); calcularTotales();">
        </div>
      </div>
    </div>
  </div>

  <!-- SECCIÓN MAGNA & PREMIUM (AGRUPADOS POR DISPENSARIO 1 AL 4) -->
  <div class="card">
    <div class="collapsible-header" onclick="toggleSection('secMagnaPrem', this)">
      <h2>Dispensarios Magna / Premium</h2>
      <span class="icon">▼</span>
    </div>
    <div id="secMagnaPrem" class="collapsible-content">
      <div id="contenedorMP"></div>
    </div>
  </div>

  <!-- SECCIÓN DIESEL (DISPENSARIOS 1 AL 4) -->
  <div class="card">
    <div class="collapsible-header" onclick="toggleSection('secDiesel', this)">
      <h2>Dispensarios Diesel</h2>
      <span class="icon">▼</span>
    </div>
    <div id="secDiesel" class="collapsible-content">
      <div id="contenedorDiesel"></div>
    </div>
  </div>

  <!-- RESUMEN Y CALCULOS FINAL -->
  <div class="card">
    <h2>Resumen de Lecturas y Ventas</h2>
    <table class="summary-table">
      <thead>
        <tr>
          <th>Combustible</th>
          <th>Litros Total</th>
          <th>Total Venta</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><span class="tag-fuel tag-magna">Magna</span></td>
          <td id="resLitrosMagna">0 Lts</td>
          <td id="resVentaMagna">$0.00</td>
        </tr>
        <tr>
          <td><span class="tag-fuel tag-premium">Premium</span></td>
          <td id="resLitrosPremium">0 Lts</td>
          <td id="resVentaPremium">$0.00</td>
        </tr>
        <tr>
          <td><span class="tag-fuel tag-diesel">Diesel</span></td>
          <td id="resLitrosDiesel">0 Lts</td>
          <td id="resVentaDiesel">$0.00</td>
        </tr>
      </tbody>
    </table>

    <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px;">
      
      <!-- Total Lecturas -->
      <div style="background: #18181b; padding: 10px; border-radius: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: bold; font-size: 0.85rem; color: var(--muted);">TOTAL LECTURAS:</span>
        <span id="resTotalLecturas" style="font-weight: bold; color: #fff; font-size: 1rem;">$0.00</span>
      </div>

      <!-- Aditivos -->
      <div class="input-group">
        <label for="inputAditivos">Venta de Aditivos / Otros (Opcional)</label>
        <input type="number" step="0.01" id="inputAditivos" placeholder="0.00" oninput="guardarAditivos(); calcularTotales();">
      </div>

      <!-- Total + Aditivos -->
      <div style="background: #18181b; padding: 10px; border-radius: 8px; border: 1px solid var(--accent); display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: bold; font-size: 0.85rem;">TOTAL + ADITIVOS:</span>
        <span id="resTotalConAditivos" style="font-weight: bold; color: var(--success); font-size: 1.05rem;">$0.00</span>
      </div>

      <!-- Sistema -->
      <div class="input-group" style="margin-top: 6px;">
        <label for="inputSistema">Total Sistema (Opcional)</label>
        <input type="number" step="0.01" id="inputSistema" placeholder="0.00" oninput="guardarSistema(); calcularTotales();">
      </div>

      <div id="boxDiferencia" class="diff-box" style="display: none;"></div>
    </div>

    <button class="btn-danger" onclick="limpiarLecturas()">Limpiar Lecturas del Día</button>
  </div>

</div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registrado:', reg))
        .catch(err => console.log('Error al registrar SW:', err));
    });
  }

  // Estructura de Lecturas
  let lecturasData = JSON.parse(localStorage.getItem('caja_lecturas_data')) || {
    magna: Array(4).fill().map(() => ({ ini: '', fin: '' })),
    premium: Array(4).fill().map(() => ({ ini: '', fin: '' })),
    diesel: Array(4).fill().map(() => ({ ini: '', fin: '' }))
  };

  const fmtMoneda = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });

  window.addEventListener('DOMContentLoaded', () => {
    cargarPrecios();
    renderDispensarios();
    cargarAditivosYSistema();
    calcularTotales();
  });

  function toggleSection(id, header) {
    const content = document.getElementById(id);
    content.classList.toggle('hidden');
    header.classList.toggle('collapsed');
  }

  function cargarPrecios() {
    const precios = JSON.parse(localStorage.getItem('caja_precios')) || { magna: 23.50, premium: 25.00, diesel: 24.80 };
    document.getElementById('precioMagna').value = precios.magna;
    document.getElementById('precioPremium').value = precios.premium;
    document.getElementById('precioDiesel').value = precios.diesel;
  }

  function guardarPrecios() {
    const precios = {
      magna: parseFloat(document.getElementById('precioMagna').value) || 0,
      premium: parseFloat(document.getElementById('precioPremium').value) || 0,
      diesel: parseFloat(document.getElementById('precioDiesel').value) || 0
    };
    localStorage.setItem('caja_precios', JSON.stringify(precios));
  }

  function cargarAditivosYSistema() {
    document.getElementById('inputAditivos').value = localStorage.getItem('caja_aditivos') || '';
    document.getElementById('inputSistema').value = localStorage.getItem('caja_sistema') || '';
  }

  function guardarAditivos() {
    localStorage.setItem('caja_aditivos', document.getElementById('inputAditivos').value);
  }

  function guardarSistema() {
    localStorage.setItem('caja_sistema', document.getElementById('inputSistema').value);
  }

  function renderDispensarios() {
    const containerMP = document.getElementById('contenedorMP');
    const containerDiesel = document.getElementById('contenedorDiesel');
    
    containerMP.innerHTML = '';
    containerDiesel.innerHTML = '';

    // Render agrupado por Dispensario 1 a 4 (Magna + Premium juntos)
    for (let i = 0; i < 4; i++) {
      const groupCard = document.createElement('div');
      groupCard.className = 'disp-group-card';
      groupCard.innerHTML = `
        <div class="disp-group-title">Dispensario #${i + 1}</div>
        ${crearFilaInputs('Magna', 'magna', i, 'tag-magna')}
        ${crearFilaInputs('Premium', 'premium', i, 'tag-premium')}
      `;
      containerMP.appendChild(groupCard);
    }

    // Render Diesel (Dispensario 1 a 4)
    for (let i = 0; i < 4; i++) {
      const groupCard = document.createElement('div');
      groupCard.className = 'disp-group-card';
      groupCard.innerHTML = `
        <div class="disp-group-title">Dispensario Diesel #${i + 1}</div>
        ${crearFilaInputs('Diesel', 'diesel', i, 'tag-diesel')}
      `;
      containerDiesel.appendChild(groupCard);
    }
  }

  function crearFilaInputs(tipoNombre, tipoKey, index, tagClass) {
    const itemData = lecturasData[tipoKey][index] || { ini: '', fin: '' };
    return `
      <div class="fuel-row">
        <div><span class="tag-fuel ${tagClass}">${tipoNombre}</span></div>
        <div class="inputs-pair">
          <div>
            <label style="font-size: 0.7rem;">Inicial</label>
            <input type="number" step="1" placeholder="0" value="${itemData.ini}" 
              oninput="actualizarLectura('${tipoKey}', ${index}, 'ini', this.value)">
          </div>
          <div>
            <label style="font-size: 0.7rem;">Final</label>
            <input type="number" step="1" placeholder="0" value="${itemData.fin}" 
              oninput="actualizarLectura('${tipoKey}', ${index}, 'fin', this.value)">
          </div>
          <div>
            <label style="font-size: 0.7rem;">Litros</label>
            <div class="liters-result" id="lts_${tipoKey}_${index}">0</div>
          </div>
        </div>
      </div>
    `;
  }

  function actualizarLectura(tipoKey, index, campo, valor) {
    lecturasData[tipoKey][index][campo] = valor === '' ? '' : parseInt(valor, 10);
    localStorage.setItem('caja_lecturas_data', JSON.stringify(lecturasData));
    calcularTotales();
  }

  function calcularTotales() {
    let ltsMagna = 0, ltsPremium = 0, ltsDiesel = 0;

    // Calcular Magna
    lecturasData.magna.forEach((item, idx) => {
      const diff = obtenerDiferencia(item.ini, item.fin);
      const el = document.getElementById(`lts_magna_${idx}`);
      if (el) el.innerText = diff.toLocaleString();
      ltsMagna += diff;
    });

    // Calcular Premium
    lecturasData.premium.forEach((item, idx) => {
      const diff = obtenerDiferencia(item.ini, item.fin);
      const el = document.getElementById(`lts_premium_${idx}`);
      if (el) el.innerText = diff.toLocaleString();
      ltsPremium += diff;
    });

    // Calcular Diesel
    lecturasData.diesel.forEach((item, idx) => {
      const diff = obtenerDiferencia(item.ini, item.fin);
      const el = document.getElementById(`lts_diesel_${idx}`);
      if (el) el.innerText = diff.toLocaleString();
      ltsDiesel += diff;
    });

    // Precios
    const pMagna = parseFloat(document.getElementById('precioMagna').value) || 0;
    const pPremium = parseFloat(document.getElementById('precioPremium').value) || 0;
    const pDiesel = parseFloat(document.getElementById('precioDiesel').value) || 0;

    const vMagna = ltsMagna * pMagna;
    const vPremium = ltsPremium * pPremium;
    const vDiesel = ltsDiesel * pDiesel;

    // Resumen de Tabla
    document.getElementById('resLitrosMagna').innerText = `${ltsMagna.toLocaleString()} Lts`;
    document.getElementById('resVentaMagna').innerText = fmtMoneda.format(vMagna);

    document.getElementById('resLitrosPremium').innerText = `${ltsPremium.toLocaleString()} Lts`;
    document.getElementById('resVentaPremium').innerText = fmtMoneda.format(vPremium);

    document.getElementById('resLitrosDiesel').innerText = `${ltsDiesel.toLocaleString()} Lts`;
    document.getElementById('resVentaDiesel').innerText = fmtMoneda.format(vDiesel);

    // Totales Desglosados
    const totalLecturas = vMagna + vPremium + vDiesel;
    const aditivos = parseFloat(document.getElementById('inputAditivos').value) || 0;
    const totalConAditivos = totalLecturas + aditivos;

    document.getElementById('resTotalLecturas').innerText = fmtMoneda.format(totalLecturas);
    document.getElementById('resTotalConAditivos').innerText = fmtMoneda.format(totalConAditivos);

    // Sistema y Diferencia (compara contra Total + Aditivos)
    const valSistema = document.getElementById('inputSistema').value;
    const boxDiff = document.getElementById('boxDiferencia');

    if (valSistema !== '' && !isNaN(parseFloat(valSistema))) {
      const sistema = parseFloat(valSistema);
      const diferencia = sistema - totalConAditivos;
      
      boxDiff.style.display = 'block';
      if (diferencia === 0) {
        boxDiff.className = 'diff-box diff-ok';
        boxDiff.innerText = `Diferencia: $0.00 (Cuadre Perfecto)`;
      } else if (diferencia > 0) {
        boxDiff.className = 'diff-box diff-ok';
        boxDiff.innerText = `Diferencia: +${fmtMoneda.format(diferencia)} (Sobrante)`;
      } else {
        boxDiff.className = 'diff-box diff-bad';
        boxDiff.innerText = `Diferencia: ${fmtMoneda.format(diferencia)} (Faltante)`;
      }
    } else {
      boxDiff.style.display = 'none';
    }
  }

  function obtenerDiferencia(ini, fin) {
    if (ini === '' || fin === '' || ini === null || fin === null) return 0;
    const valIni = parseInt(ini, 10);
    const valFin = parseInt(fin, 10);
    if (isNaN(valIni) || isNaN(valFin)) return 0;
    return valFin >= valIni ? valFin - valIni : 0;
  }

  function limpiarLecturas() {
    if (confirm("¿Deseas reiniciar todas las lecturas de los dispensarios a cero?")) {
      lecturasData = {
        magna: Array(4).fill().map(() => ({ ini: '', fin: '' })),
        premium: Array(4).fill().map(() => ({ ini: '', fin: '' })),
        diesel: Array(4).fill().map(() => ({ ini: '', fin: '' }))
      };
      localStorage.setItem('caja_lecturas_data', JSON.stringify(lecturasData));
      
      document.getElementById('inputAditivos').value = '';
      document.getElementById('inputSistema').value = '';
      localStorage.removeItem('caja_aditivos');
      localStorage.removeItem('caja_sistema');

      renderDispensarios();
      calcularTotales();
    }
  }
</script>

</body>
</html>
